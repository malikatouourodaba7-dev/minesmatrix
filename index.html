<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIGNAL BOT AI</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Roboto, sans-serif; }
        body { background-color: #0b0e14; color: white; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 10px; }
        .app-container { width: 100%; max-width: 420px; background: #121824; border-radius: 20px; padding: 15px; border: 1px solid #1f293d; text-align: center; }
        
        /* Header */
        .header { display: flex; justify-content: center; align-items: center; margin-bottom: 15px; font-weight: bold; }
        .title { font-size: 1.1rem; color: #3b82f6; letter-spacing: 1px; }
        
        /* Games Grid Menu */
        .games-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }
        .game-card { 
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%); 
            border: 1px solid #334155; 
            border-radius: 14px; 
            height: 90px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            cursor: pointer; 
            transition: transform 0.2s, border-color 0.2s; 
            position: relative; 
            overflow: hidden;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
        }
        .game-card:active { transform: scale(0.97); }
        .game-card:hover { border-color: #3b82f6; }
        .game-card.full-width { grid-column: span 2; height: 100px; background: linear-gradient(135deg, #1e1b4b 0%, #0f172a 100%); }
        
        .game-card .game-icon { font-size: 1.8rem; margin-bottom: 4px; }
        .game-card .game-title { font-weight: 800; font-size: 0.95rem; text-transform: uppercase; letter-spacing: 0.5px; }
        .game-card .game-sub { font-size: 0.7rem; color: #94a3b8; margin-top: 2px; }
        
        .game-card .badge { position: absolute; top: 6px; left: 6px; background: #22c55e; color: black; font-size: 0.6rem; font-weight: 800; padding: 2px 6px; border-radius: 4px; text-transform: uppercase; }
        .game-card .badge.orange { background: #f97316; color: white; }

        /* Color Themes for Cards */
        .card-avia { border-color: #f59e0b; }
        .card-avia .game-title { color: #fbbf24; }
        .card-mines { border-color: #06b6d4; }
        .card-mines .game-title { color: #38bdf8; }
        .card-spribe { border-color: #3b82f6; }
        .card-spribe .game-title { color: #60a5fa; }
        .card-king { border-color: #a855f7; }
        .card-king .game-title { color: #c084fc; }
        .card-chicken { border-color: #ef4444; }
        .card-chicken .game-title { color: #f87171; }
        .card-speed { border-color: #10b981; }
        .card-speed .game-title { color: #34d399; }
        .card-balloon { border-color: #ec4899; }
        .card-balloon .game-title { color: #f472b6; }
        
        /* Mines Game Screen */
        .hidden { display: none; }
        .controls-label { font-size: 0.85rem; color: #9ca3af; margin-bottom: 8px; font-weight: bold; }
        .controls { display: flex; justify-content: center; gap: 6px; margin: 10px 0 15px 0; flex-wrap: wrap; }
        .trap-btn { background: #1a2234; border: 1px solid #2a364f; color: white; padding: 8px 12px; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 0.9rem; min-width: 38px; }
        .trap-btn.active { background: #22c55e; border-color: #16a34a; color: black; }

        .grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; margin: 15px 0; }
        .cell { aspect-ratio: 1; background: #1a2234; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 1.5rem; border: 1px solid #2a364f; transition: all 0.2s; }
        .cell.star { background: #1e3a8a; border-color: #3b82f6; box-shadow: 0 0 10px rgba(59, 130, 246, 0.5); }

        /* Buttons */
        .btn-main { width: 100%; background: #22c55e; color: black; border: none; padding: 14px; border-radius: 12px; font-weight: bold; font-size: 1rem; cursor: pointer; margin-top: 10px; }
        .btn-main:hover { background: #16a34a; }
        .btn-share { width: 100%; background: #9333ea; color: white; border: none; padding: 12px; border-radius: 12px; font-weight: bold; font-size: 0.9rem; cursor: pointer; margin-top: 15px; }
        .btn-back { background: transparent; border: none; color: #9ca3af; cursor: pointer; margin-bottom: 10px; font-size: 0.9rem; display: inline-block; }
    </style>
</head>
<body>

<div class="app-container">
    <!-- MENU PRINCIPAL -->
    <div id="main-menu">
        <div class="header">
            <span class="title">⚡ SIGNAL BOT AI ⚡</span>
        </div>
        
        <div class="games-grid">
            <!-- Avia Masters -->
            <div class="game-card full-width card-avia" onclick="alert('Indisponible pour le moment')">
                <span class="badge orange">NOUVEAU</span>
                <div class="game-icon">✈️</div>
                <div class="game-title">AVIA MASTERS</div>
            </div>

            <!-- Mines 1Win -->
            <div class="game-card card-mines" onclick="openGame('Mines 1Win')">
                <span class="badge orange">POPULAIRE</span>
                <div class="game-icon">💣</div>
                <div class="game-title">MINES</div>
                <div class="game-sub">1Win</div>
            </div>

            <!-- Mines Spribe -->
            <div class="game-card card-spribe" onclick="openGame('Mines Spribe')">
                <span class="badge orange">POPULAIRE</span>
                <div class="game-icon">⭐</div>
                <div class="game-title">MINES</div>
                <div class="game-sub">Spribe</div>
            </div>

            <!-- King Thimbles -->
            <div class="game-card card-king" onclick="alert('Indisponible pour le moment')">
                <span class="badge">NOUVEAU</span>
                <div class="game-icon">👑</div>
                <div class="game-title">KING THIMBLES</div>
            </div>

            <!-- Chicken Road -->
            <div class="game-card card-chicken" onclick="alert('Indisponible pour le moment')">
                <span class="badge">NOUVEAU</span>
                <div class="game-icon">🐔</div>
                <div class="game-title">CHICKEN ROAD</div>
            </div>

            <!-- Speed & Cash -->
            <div class="game-card card-speed" onclick="alert('Indisponible pour le moment')">
                <span class="badge">NOUVEAU</span>
                <div class="game-icon">🏎️</div>
                <div class="game-title">SPEED & CASH</div>
            </div>

            <!-- Balloon -->
            <div class="game-card card-balloon" onclick="alert('Indisponible pour le moment')">
                <span class="badge">NOUVEAU</span>
                <div class="game-icon">🎈</div>
                <div class="game-title">BALLOON</div>
            </div>
        </div>

        <button class="btn-share" onclick="alert('Lien partagé !')">Partager le bot</button>
    </div>

    <!-- ECRAN JEU MINES -->
    <div id="mines-screen" class="hidden">
        <button class="btn-back" onclick="showMenu()">← Retour au menu</button>
        <div class="header">
            <span class="title" id="game-title-header">MINES AI BOT</span>
        </div>

        <p class="controls-label">Nombre de pièges (mines) dans le jeu :</p>
        <div class="controls">
            <button class="trap-btn" onclick="setTraps(1, this)">1</button>
            <button class="trap-btn" onclick="setTraps(2, this)">2</button>
            <button class="trap-btn active" onclick="setTraps(3, this)">3</button>
            <button class="trap-btn" onclick="setTraps(4, this)">4</button>
            <button class="trap-btn" onclick="setTraps(5, this)">5</button>
            <button class="trap-btn" onclick="setTraps(6, this)">6</button>
            <button class="trap-btn" onclick="setTraps(7, this)">7</button>
        </div>

        <div class="grid" id="grid"></div>

        <button class="btn-main" onclick="getSignal()">OBTENIR LE SIGNAL</button>
    </div>
</div>

<script>
    let selectedTraps = 3;

    function createGrid() {
        const grid = document.getElementById('grid');
        grid.innerHTML = '';
        for (let i = 0; i < 25; i++) {
            const cell = document.createElement('div');
            cell.className = 'cell';
            grid.appendChild(cell);
        }
    }

    function openGame(name) {
        document.getElementById('game-title-header').innerText = name.toUpperCase() + ' AI BOT';
        document.getElementById('main-menu').classList.add('hidden');
        document.getElementById('mines-screen').classList.remove('hidden');
        createGrid();
    }

    function showMenu() {
        document.getElementById('mines-screen').classList.add('hidden');
        document.getElementById('main-menu').classList.remove('hidden');
    }

    function setTraps(count, btn) {
        selectedTraps = count;
        document.querySelectorAll('.trap-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
    }

    // Stratégie d'analyse selon le nombre de pièges
    function getSignal() {
        createGrid();
        const cells = document.querySelectorAll('.cell');
        
        // Détermination du nombre de cases sûres selon la sécurité/risque du nombre de pièges
        let safeSpotsCount = 4;
        if (selectedTraps === 1) safeSpotsCount = 6;
        else if (selectedTraps === 2) safeSpotsCount = 5;
        else if (selectedTraps === 3) safeSpotsCount = 4;
        else if (selectedTraps === 4) safeSpotsCount = 3;
        else if (selectedTraps >= 5) safeSpotsCount = 2;

        // Génération des emplacements optimisés
        const indices = [];
        while(indices.length < safeSpotsCount) {
            const r = Math.floor(Math.random() * 25);
            if(!indices.includes(r)) indices.push(r);
        }

        indices.forEach(idx => {
            cells[idx].classList.add('star');
            cells[idx].innerHTML = '⭐';
        });
    }
</script>

</body>
</html>
